# Install as two server blocks in Ubuntu Nginx. Configure TLS before public use.
# Node listens on 127.0.0.1:3000; do not expose that port publicly.
server {
    listen 80;
    server_name aodase.reinbor.cloud;
    client_max_body_size 1m;
    root /var/www/aodase/dist;
    index index.html;

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /admin-management-ui.js { return 404; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name aodaseadmin.reinbor.cloud;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
